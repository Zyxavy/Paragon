<!doctype html>
<html lang="en" data-theme="light">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="description" content="Paragon — Systems that work on your worst day. A personal tool for designing, running, and refining repeatable processes." />
		<script>
			function isChunkLoadFailure(msg) {
				return (
					msg.indexOf('error loading dynamically imported module') !== -1 ||
					msg.indexOf('Importing a module script failed') !== -1 ||
					msg.indexOf('failed to fetch dynamically imported module') !== -1
				);
			}
			window.addEventListener('error', function (e) {
				var msg = e && e.message ? String(e.message) : '';
				if (isChunkLoadFailure(msg)) {
					window.location.reload();
				}
			});
			window.addEventListener('unhandledrejection', function (e) {
				var reason = e && e.reason;
				var msg = reason && reason.message ? String(reason.message) : '';
				if (isChunkLoadFailure(msg)) {
					window.location.reload();
				}
			});
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
